version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: patient_twin_db
    environment:
      POSTGRES_USER: twin_user
      POSTGRES_PASSWORD: twin_password
      POSTGRES_DB: patient_twin_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twin_user -d patient_twin_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: patient_twin_backend
    environment:
      - DATABASE_URL=postgresql://twin_user:twin_password@db:5432/patient_twin_db
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: patient_twin_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
